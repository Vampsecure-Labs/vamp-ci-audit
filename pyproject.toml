[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-ci-audit"
version = "1.0"
description = "CI/CD pipeline security auditor: GitHub Actions, GitLab CI and Forgejo Actions"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.9"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["security", "pentest", "audit", "cybersecurity", "vampsecure", "cicd", "github-actions", "devops", "devsecops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.7.0",
    "pyyaml>=6.0",
]

[project.scripts]
vamp-ci-audit = "vamp_ci_audit:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-ci-audit"
Repository = "https://github.com/Vampsecure-Labs/vamp-ci-audit"

[tool.setuptools]
py-modules = ["vamp_ci_audit"]
